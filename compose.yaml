
services:
  mongodb:
    image: mongo:8.0
    container_name: bookmark_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - root
        - --password
        - example
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10

  main_service:
    build:
      context: .
      dockerfile: main_service/Dockerfile
    container_name: bookmark_main
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://root:example@mongodb:27017/?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

  report_service:
    build: ./report_service
    container_name: bookmark_reports
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MAIN_SERVICE_URL: http://main_service:8000
    depends_on:
      - main_service

volumes:
  mongo_data:
